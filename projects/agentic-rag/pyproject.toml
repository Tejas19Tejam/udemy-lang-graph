[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tejas19Tejam", email = "vasudevtejam@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.28",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
